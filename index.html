<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有件事想告诉你</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hearts" aria-hidden="true"></div>

    <main class="card" id="ask-card">
      <p class="eyebrow">悄悄问你一件事</p>
      <h1>做我的对象，好不好？</h1>
      <p class="subtitle">想了很久，还是想亲口问你。</p>
      <div class="actions">
        <button id="yes-btn" type="button">同意</button>
        <button id="no-btn" type="button">不同意</button>
      </div>
      <p class="hint" id="hint">左边那个才是正确答案哦</p>
    </main>

    <section class="success hidden" id="success">
      <div class="burst" aria-hidden="true"></div>
      <h2>我就知道你会同意！</h2>
      <p>从今天起，你被我承包啦。</p>
      <div class="heart-icon" aria-hidden="true"></div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
